# fastapi/fastapi's test.yml: test (os ubuntu-latest, python-version 3.14, uv-resolution highest, starlette-src starlette-git, deprecated-tests test-deprecation), for the SuperCI scoreboard.
name: SuperCI (GitHub)

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_NO_SYNC: true
  INLINE_SNAPSHOT_DEFAULT_FLAGS: review

jobs:
  test:
    name: test / github
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"
      UV_RESOLUTION: highest
      STARLETTE_SRC: starlette-git
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install Dependencies
        run: uv sync --no-dev --group tests --extra all
      - name: Install Starlette from source
        run: uv pip install "git+https://github.com/Kludex/starlette@main"
      - name: Install deprecated libraries just for testing
        run: uv pip install orjson ujson
      - run: mkdir coverage
      - name: Test
        run: uv run --no-sync bash scripts/test-cov.sh $PYTEST_OPTIONS
        env:
          COVERAGE_FILE: coverage/.coverage.${{ runner.os }}-py3.14-test-deprecation
          CONTEXT: ${{ runner.os }}-py3.14-test-deprecation
          PYTEST_OPTIONS: ""
